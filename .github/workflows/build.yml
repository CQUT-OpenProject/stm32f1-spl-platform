name: Firmware builds

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker build -t stm32f1-dev .
      - name: Build and verify with GCC and Clang
        run: |
          docker run --rm -v "$PWD:/workspace/stm32f1-spl-platform" stm32f1-dev bash -ec '
            for preset in gcc-c8-debug clang-rc-release; do
              cmake --preset "$preset" -B "/tmp/$preset"
              cmake --build "/tmp/$preset" --parallel 4
              python3 tests/verify.py --build-dir "/tmp/$preset"
            done
          '

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        chip: [c8, rc]
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi clang lld cmake make
          arm-none-eabi-gcc --version
          clang --version
          ld.lld --version
      - name: Verify source manifest
        run: python3 scripts/prepare_sources.py --root .
      - name: Configure and build
        env:
          PRESET: ${{ matrix.compiler }}-${{ matrix.chip }}-${{ matrix.mode }}
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET" --parallel 4
      - name: Verify ELF and integration
        env:
          PRESET: ${{ matrix.compiler }}-${{ matrix.chip }}-${{ matrix.mode }}
          CHIP: ${{ matrix.chip }}
        run: |
          args=()
          if [[ "$CHIP" == c8 ]]; then args+=(--integration); fi
          python3 tests/verify.py --build-dir "build/$PRESET" "${args[@]}"
      - name: Archive firmware and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.compiler }}-${{ matrix.chip }}-${{ matrix.mode }}
          path: |
            build/*/examples/*.elf
            build/*/examples/*.bin
            build/*/examples/*.hex
            build/*/examples/*.map
            build/*/verification/*.log
